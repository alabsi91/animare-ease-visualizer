<layout src="@layouts/main.layout.html" title="Animare Ease Visualizer" description="Animare Ease Visualizer">
  <body>
    <!-- Blocking classic script to prevent layout shifts because these are web components -->
    <script iife bundle bundle-externals>
      import("@staticview/ui/accordion");
      import("@staticview/ui/anchor");
      import("@staticview/ui/flyout");
      import("@staticview/ui/alert-stack");
      import("@staticview/ui/code-editor");
      import("@staticview/ui/combobox");
      import("@staticview/ui/dialog");
      import("@staticview/ui/menu");
      import("@staticview/ui/slider");
      import("@staticview/ui/toggle-checkbox");
      import("@staticview/ui/tooltip");
    </script>

    <main>
      <part src="@parts/side-panel/side-panel.part.html"></part>
      <part src="@parts/small-side-panel/small-side-panel.part.html"></part>
      <graph-editor></graph-editor>
    </main>

    <sv-alert-stack swipe-dismiss></sv-alert-stack>

    <part src="@parts/help-dialog/help-dialog.part.html"></part>
    <part src="@parts/export-dialogs/css-keyframe.part.html"></part>
    <part src="@parts/export-dialogs/css-linear.part.html"></part>
    <part src="@parts/export-dialogs/svg-path.part.html"></part>
    <part src="@parts/export-dialogs/js-function.part.html"></part>

    <div class="theme-layer"></div>

    <!-- The app bundle with animare.js and without highlight.js -->
    <script type="module" bundle bundle-externals="**/highlight.js/**">
      import "@graph-editor/graph-editor.ts";
      import "@scripts/main.ts";
    </script>
  </body>
</layout>

<insert selector="head">
  <link class="svg-highlight" rel="stylesheet" href="@styles/svg-path-highlight.css" inline />
  <link class="hljs-light" rel="stylesheet" href="highlight.js/styles/atom-one-light.min.css" inline />
  <link class="hljs-dark" rel="stylesheet" href="highlight.js/styles/atom-one-dark.min.css" inline />
</insert>
