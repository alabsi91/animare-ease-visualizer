<!-- @part - The menu-trigger custom element slot. -->
<slot name="trigger"></slot>

<anchor-component style="display: contents">
  <!-- @part - The menu popover element. -->
  <div id="popover" class="popover" part="container" popover="manual" role="menu">
    <!-- @slot - The content of the menu. -->
    <slot></slot>
  </div>
</anchor-component>
