  <script type="module" production-only>
    const firebaseConfig = {
      apiKey: "AIzaSyAU26SFWmVYNvIFymLkA55DUhhiZ_3vBME",
      authDomain: "animare-ease-visualizer.firebaseapp.com",
      projectId: "animare-ease-visualizer",

      measurementId: "G-KG471HBTE5",
    };

    async function loadAnalytics() {
      const [{ initializeApp }, { getAnalytics }] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js"),
      ]);

      getAnalytics(initializeApp(firebaseConfig));
    }

    if ("requestIdleCallback" in window) {
      requestIdleCallback(loadAnalytics, { timeout: 5000 });
    } else {
      addEventListener("load", loadAnalytics);
    }
  </script>
