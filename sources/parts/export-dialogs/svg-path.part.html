<sv-dialog id="export-svg-dialog" class="export-dialog" aria-labelledby="export-svg-title" close-button>
  <h1 id="export-svg-title" class="export-dialog-title">Export as SVG</h1>

  <div class="content">
    <div class="label-input-container">
      <label for="export-svg-scale">Scale</label>
      <input id="export-svg-scale" type="number" autocomplete="off" name="scale" value="100" />
    </div>

    <div class="checkbox-label-container">
      <label for="export-svg-fit">Fit the box to the curve</label>
      <sv-toggle-checkbox id="export-svg-fit" checked></sv-toggle-checkbox>
    </div>

    <div
      id="export-svg-preview"
      class="export-preview"
      aria-describedby="export-svg-preview-tooltip"
      aria-label="The exported svg"
      data-sv-tooltip="export-svg-preview-tooltip"
      role="img"
    ></div>
    <sv-tooltip id="export-svg-preview-tooltip" side="inline-end">A preview of the SVG below.</sv-tooltip>

    <sv-code-editor
      id="export-svg-code-preview"
      class="export-code-preview"
      copy-button
      expand
      linenumbers
      readonly
      wrap
      wrap-button
    ></sv-code-editor>

    <div class="export-buttons-container">
      <button id="export-svg-copy-btn" type="submit" class="export-btn">Copy</button>
      <button id="export-svg-download-btn" type="submit" class="export-btn">Download</button>
    </div>
  </div>
</sv-dialog>
