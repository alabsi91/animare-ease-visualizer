<sv-dialog class="export-dialog" id="export-svg-dialog" aria-labelledby="export-svg-title" close-button>
  <h1 class="export-dialog-title" id="export-svg-title">Export as SVG</h1>

  <div class="content">
    <div class="label-input-container">
      <label for="export-svg-scale">Scale</label>
      <input type="number" name="scale" id="export-svg-scale" value="100" autocomplete="off" />
    </div>

    <sv-code-editor
      class="export-code-preview"
      id="export-svg-code-preview"
      code-stylesheet=".atom-one-dark"
      linenumbers
      copy-button
      wrap-button
      readonly
      expand
    ></sv-code-editor>

    <div class="export-buttons-container">
      <button class="export-btn" id="export-svg-copy-btn">Copy</button>
      <button class="export-btn" id="export-svg-download-btn">Download</button>
    </div>
  </div>
</sv-dialog>
