<sv-dialog id="export-js-function-dialog" class="export-dialog" aria-labelledby="export-js-function-title" close-button>
  <h1 id="export-js-function-title" class="export-dialog-title">Export as JavaScript function</h1>

  <div id="export-js-function-warning" class="warning" hidden></div>

  <div class="content">
    <div class="label-input-container">
      <label for="export-js-function-samples">Samples</label>
      <input id="export-js-function-samples" type="number" autocomplete="off" name="samples" value="100" />
    </div>

    <div class="label-input-container">
      <label for="export-js-function-name">Name</label>
      <input id="export-js-function-name" type="text" autocomplete="off" name="name" value="customEasing" />
    </div>

    <sv-segmented-control id="export-js-function-target" class="export-format" aria-label="Target" value="javascript">
      <button type="submit" value="javascript">Java&#8203;Script</button>
      <button type="submit" value="after-effects">After Effects</button>
    </sv-segmented-control>

    <sv-code-editor
      id="export-js-function-code-preview"
      class="export-code-preview"
      copy-button
      expand
      linenumbers
      readonly
      wrap-button
    ></sv-code-editor>

    <div class="export-buttons-container">
      <button id="export-js-function-copy-btn" type="submit" class="export-btn">Copy</button>
      <button id="export-js-function-download-btn" type="submit" class="export-btn">Download</button>
    </div>
  </div>
</sv-dialog>
