<sv-dialog id="export-compose-dialog" class="export-dialog" aria-labelledby="export-compose-title" close-button>
  <h1 id="export-compose-title" class="export-dialog-title">Export as Jetpack Compose easing</h1>

  <div id="export-compose-warning" class="warning" hidden></div>

  <div class="content">
    <div class="label-input-container">
      <label for="export-compose-name">Name</label>
      <input id="export-compose-name" type="text" autocomplete="off" name="name" value="customEasing" />
    </div>

    <sv-code-editor
      id="export-compose-code-preview"
      class="export-code-preview"
      copy-button
      expand
      linenumbers
      readonly
      wrap-button
    ></sv-code-editor>

    <div class="export-buttons-container">
      <button id="export-compose-copy-btn" type="submit" class="export-btn">Copy</button>
      <button id="export-compose-download-btn" type="submit" class="export-btn">Download</button>
    </div>
  </div>
</sv-dialog>
