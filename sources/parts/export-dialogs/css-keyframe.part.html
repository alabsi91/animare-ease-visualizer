<sv-dialog class="export-dialog" id="export-css-keyframe-dialog" aria-labelledby="export-css-keyframe-title" close-button>
  <h1 class="export-dialog-title" id="export-css-keyframe-title">Export as CSS Keyframes</h1>

  <div class="content">
    <div class="warning" id="export-css-keyframe-warning">
      The current path uses a single curve, which can be represented with the CSS
      <strong>cubic-bezier()</strong>
      function. Consider using multiple curves to generate the result as a keyframes animation.
    </div>

    <div class="export-inputs-container" id="export-css-keyframe-inputs-container">
      <div class="label-input-container">
        <span class="label">Property</span>
        <sv-code-editor id="export-css-keyframe-property" one-line expand>
          <pre>transform: translateX({value}%);</pre>
        </sv-code-editor>
      </div>

      <div class="label-input-container">
        <label for="export-css-keyframe-samples">Samples</label>
        <input type="number" name="samples" id="export-css-keyframe-samples" autocomplete="off" value="100" />
      </div>

      <div class="label-input-container">
        <label for="export-css-keyframe-from">From</label>
        <input type="number" name="from" id="export-css-keyframe-from" autocomplete="off" value="0" />
      </div>

      <div class="label-input-container">
        <label for="export-css-keyframe-to">To</label>
        <input type="number" name="to" id="export-css-keyframe-to" autocomplete="off" value="100" />
      </div>
    </div>

    <sv-code-editor
      class="export-code-preview"
      id="export-css-keyframe-code-preview"
      linenumbers
      copy-button
      wrap-button
      readonly
      expand
    ></sv-code-editor>

    <button class="export-btn" id="export-css-keyframe-copy-btn">Copy</button>
  </div>
</sv-dialog>
