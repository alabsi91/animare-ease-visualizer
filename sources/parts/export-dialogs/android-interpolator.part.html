<sv-dialog id="export-android-dialog" class="export-dialog" aria-labelledby="export-android-title" close-button>
  <h1 id="export-android-title" class="export-dialog-title">Export as Android interpolator</h1>

  <div id="export-android-warning" class="warning" hidden></div>

  <div class="content">
    <div class="label-input-container">
      <label for="export-android-name">File name</label>
      <input id="export-android-name" type="text" autocomplete="off" name="name" value="custom_ease" />
    </div>

    <sv-code-editor
      id="export-android-code-preview"
      class="export-code-preview"
      copy-button
      expand
      linenumbers
      readonly
      wrap
      wrap-button
    ></sv-code-editor>

    <div class="export-buttons-container">
      <button id="export-android-copy-btn" type="submit" class="export-btn">Copy</button>
      <button id="export-android-download-btn" type="submit" class="export-btn">Download</button>
    </div>
  </div>
</sv-dialog>
