<sv-dialog id="export-gsap-dialog" class="export-dialog" aria-labelledby="export-gsap-title" close-button>
  <h1 id="export-gsap-title" class="export-dialog-title">Export as GSAP CustomEase</h1>

  <div class="content">
    <div class="label-input-container">
      <label for="export-gsap-name">Name</label>
      <input id="export-gsap-name" type="text" autocomplete="off" name="name" value="customEase" />
    </div>

    <sv-code-editor
      id="export-gsap-code-preview"
      class="export-code-preview"
      copy-button
      expand
      linenumbers
      readonly
      wrap-button
    ></sv-code-editor>

    <button id="export-gsap-copy-btn" type="submit" class="export-btn">Copy</button>
  </div>
</sv-dialog>
