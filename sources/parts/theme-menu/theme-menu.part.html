<sv-menu class="theme-menu">
  <sv-flyout>
    <button
      type="button"
      class="icon-btn theme-menu-trigger"
      aria-describedby="{{ $data.tooltipId }}"
      aria-label="Choose a color theme"
      data-sv-tooltip="{{ $data.tooltipId }}"
      slot="trigger"
    >
      <svg aria-hidden="true" viewBox="0 -960 960 960" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M480-80q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-83 32.5-156t88-127Q256-817 330-848.5T488-880q80 0 151 27.5t124.5 76q53.5 48.5 85 115T880-518q0 115-70 176.5T640-280h-74q-9 0-12.5 5t-3.5 11q0 12 15 34t15 50q0 50-27.5 74T480-80Zm-220-400q26 0 43-17t17-43q0-26-17-43t-43-17q-26 0-43 17t-17 43q0 26 17 43t43 17Zm120-160q26 0 43-17t17-43q0-26-17-43t-43-17q-26 0-43 17t-17 43q0 26 17 43t43 17Zm200 0q26 0 43-17t17-43q0-26-17-43t-43-17q-26 0-43 17t-17 43q0 26 17 43t43 17Zm120 160q26 0 43-17t17-43q0-26-17-43t-43-17q-26 0-43 17t-17 43q0 26 17 43t43 17Z"
        />
      </svg>
    </button>

    <button type="button" class="theme-option" aria-checked="false" data-theme="gold" role="menuitemradio">
      <span class="theme-swatch" aria-hidden="true"></span>
      Gold
    </button>

    <button type="button" class="theme-option" aria-checked="false" data-theme="ocean" role="menuitemradio">
      <span class="theme-swatch" aria-hidden="true"></span>
      Ocean
    </button>

    <button type="button" class="theme-option" aria-checked="false" data-theme="forest" role="menuitemradio">
      <span class="theme-swatch" aria-hidden="true"></span>
      Forest
    </button>

    <button type="button" class="theme-option" aria-checked="false" data-theme="sunset" role="menuitemradio">
      <span class="theme-swatch" aria-hidden="true"></span>
      Sunset
    </button>

    <button type="button" class="theme-option" aria-checked="false" data-theme="rose" role="menuitemradio">
      <span class="theme-swatch" aria-hidden="true"></span>
      Rose
    </button>

    <button type="button" class="theme-option" aria-checked="false" data-theme="violet" role="menuitemradio">
      <span class="theme-swatch" aria-hidden="true"></span>
      Violet
    </button>

    <button type="button" class="theme-option" aria-checked="false" data-theme="mono" role="menuitemradio">
      <span class="theme-swatch" aria-hidden="true"></span>
      Mono
    </button>
  </sv-flyout>
</sv-menu>

<sv-tooltip id="{{ $data.tooltipId }}" side="{{ $data.tooltipSide }}">Color theme</sv-tooltip>

<insert selector="head">
  <script type="application/x-typescript">
    const STORAGE_KEY = "theme";
    const DEFAULT_THEME = "gold";

    document.documentElement.dataset.theme = window.localStorage.getItem(STORAGE_KEY) ?? DEFAULT_THEME;

    function markCheckedOption(options: NodeListOf<HTMLButtonElement>, theme: string) {
      for (const option of options) {
        option.setAttribute("aria-checked", String(option.dataset.theme === theme));
      }
    }

    function getAccentHexColor() {
      const probe = document.createElement("span");
      probe.style.color = "var(--sb-color-accent)";
      document.body.append(probe);
      const accentColor = window.getComputedStyle(probe).color;
      probe.remove();

      const canvas = document.createElement("canvas");
      canvas.width = 1;
      canvas.height = 1;

      const context = canvas.getContext("2d")!;
      context.fillStyle = accentColor;
      context.fillRect(0, 0, 1, 1);

      const [red, green, blue] = context.getImageData(0, 0, 1, 1).data;
      return "#" + [red, green, blue].map(channel => channel.toString(16).padStart(2, "0")).join("");
    }

    const faviconLink = document.querySelector<HTMLLinkElement>('link[rel="icon"][type="image/svg+xml"]');
    const faviconHref = faviconLink?.href;
    let faviconDocument: Document | undefined;

    async function paintFavicon() {
      if (!faviconLink || !faviconHref) return;

      if (!faviconDocument) {
        const response = await fetch(faviconHref);
        faviconDocument = new DOMParser().parseFromString(await response.text(), "image/svg+xml");
      }

      faviconDocument.getElementById("favicon-tile")!.setAttribute("fill", getAccentHexColor());

      const markup = new XMLSerializer().serializeToString(faviconDocument);
      faviconLink.href = "data:image/svg+xml," + encodeURIComponent(markup);
    }

    function setupThemeMenus() {
      const options = document.querySelectorAll<HTMLButtonElement>(".theme-option");

      markCheckedOption(options, document.documentElement.dataset.theme!);
      paintFavicon();

      for (const option of options) {
        option.addEventListener("click", () => {
          const theme = option.dataset.theme!;

          document.documentElement.dataset.theme = theme;
          window.localStorage.setItem(STORAGE_KEY, theme);
          markCheckedOption(options, theme);
          paintFavicon();
        });
      }

      document.addEventListener("color-scheme-changed", () => void paintFavicon());
    }

    document.addEventListener("DOMContentLoaded", setupThemeMenus, { once: true, passive: true });
  </script>
</insert>
