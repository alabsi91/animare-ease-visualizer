<div class="small-side-panel">
  <div class="panel-container">
    <div class="small-panel-group">
      <button
        type="submit"
        class="toggle-panel-btn show-side-panel"
        aria-describedby="show-panel-tooltip"
        aria-label="show side panel"
        data-sv-tooltip="show-panel-tooltip"
      >
        <svg aria-hidden="true" viewBox="0 -960 960 960" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M360-160v-640q0-17 11.5-28.5T400-840q17 0 28.5 11.5T440-800v640q0 17-11.5 28.5T400-120q-17 0-28.5-11.5T360-160Zm160-168v-304q0-14 12-19t22 5l138 138q12 12 12 28t-12 28L554-314q-10 10-22 5t-12-19Z"
          />
        </svg>
      </button>
      <sv-tooltip id="show-panel-tooltip" side="inline-end">Show side panel</sv-tooltip>

      <div class="divider"></div>

      <button type="submit" class="small-panel-controls-btn play-btn" aria-label="Play animation">
        <svg class="small-control-btn-icon" aria-hidden="true" viewBox="0 -960 960 960" xmlns="http://www.w3.org/2000/svg">
          <path d="M320-200v-560l440 280-440 280Z" />
        </svg>
      </button>

      <button type="submit" class="small-panel-controls-btn pause-btn" aria-label="Pause animation">
        <svg class="small-control-btn-icon" aria-hidden="true" viewBox="0 -960 960 960" xmlns="http://www.w3.org/2000/svg">
          <path d="M560-200v-560h160v560H560Zm-320 0v-560h160v560H240Z" />
        </svg>
      </button>

      <button type="submit" class="small-panel-controls-btn stop-btn" aria-label="Stop animation">
        <svg class="small-control-btn-icon" aria-hidden="true" viewBox="0 -960 960 960" xmlns="http://www.w3.org/2000/svg">
          <path d="M240-240v-480h480v480H240Z" />
        </svg>
      </button>
    </div>

    <div class="small-panel-group">
      <div class="divider"></div>

      <part
        src="@parts/color-scheme-switch/color-scheme-switch.part.html"
        tooltipid="small-color-scheme-tooltip"
        tooltipside="inline-end"
      ></part>

      <button
        type="submit"
        class="icon-btn open-help-dialog"
        aria-describedby="small-help-tooltip"
        aria-label="Open the help dialog"
        data-dialog-open="help-dialog"
        data-sv-tooltip="small-help-tooltip"
      >
        <svg aria-hidden="true" inline src="@assets/help.svg"></svg>
      </button>
      <sv-tooltip id="small-help-tooltip" side="inline-end">Help</sv-tooltip>

      <part src="@parts/github-link/github-link.part.html" tooltipid="small-github-tooltip" tooltipside="inline-end"></part>
    </div>
  </div>
</div>
