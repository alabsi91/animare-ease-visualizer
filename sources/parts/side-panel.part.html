<div class="side-panel custom-scrollbar">
  <div class="panel-container">
    <div class="hide-panel-btn-container">
      <div style="display: flex; gap: 1em">
        <part src="@parts/contact-us.part.html"></part>

        <button
          class="icon-btn open-shortcuts-dialog"
          data-dialog-open="shortcuts-dialog"
          aria-label="Open keyboard shortcuts dialog"
          data-sv-tooltip="shortcuts-tooltip"
          aria-describedby="shortcuts-tooltip"
        >
          <svg src="@assets/keyboard.svg" aria-hidden="true" inline></svg>
        </button>
        <sv-tooltip id="shortcuts-tooltip" side="inline-start">Keyboard Shortcuts</sv-tooltip>
      </div>

      <button
        class="toggle-panel-btn hide-panel-btn"
        aria-label="Hide side panel"
        data-sv-tooltip="hide-panel-tooltip"
        aria-describedby="hide-panel-tooltip"
      >
        <svg src="@assets/hide-panle.svg" aria-hidden="true" inline></svg>
      </button>
      <sv-tooltip id="hide-panel-tooltip" side="inline-end">Hide side panel</sv-tooltip>
    </div>

    <div class="divider"></div>

    <div class="controls-container">
      <button class="control-btn play-btn" aria-label="Play animation">
        <svg class="control-btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
          <path d="M320-200v-560l440 280-440 280Z" />
        </svg>
        <span>Play</span>
      </button>

      <button class="control-btn pause-btn" aria-label="Pause animation">
        <svg class="control-btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
          <path d="M560-200v-560h160v560H560Zm-320 0v-560h160v560H240Z" />
        </svg>
        <span>Pause</span>
      </button>

      <button class="control-btn stop-btn" aria-label="Stop animation">
        <svg class="control-btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
          <path d="M240-240v-480h480v480H240Z" />
        </svg>
        <span>Stop</span>
      </button>
    </div>

    <br />
    <sv-slider class="progress-slider" value="0" aria-label="Progress seek" step="0.01" disabled></sv-slider>

    <div class="divider"></div>

    <p class="panel-title">Presets</p>

    <br />

    <div class="presets-menu-container">
      <menu-component class="presets-menu" match-trigger-width="true">
        <menu-trigger slot="trigger" trigger-label="Presets"></menu-trigger>
      </menu-component>

      <div class="save-preset-container">
        <input type="text" name="preset-name" class="save-preset-name-input" placeholder="Preset name" />
        <button class="save-preset-btn" data-sv-tooltip="save-preset-tooltip" aria-describedby="save-preset-tooltip">Save</button>
      </div>

      <sv-tooltip id="save-preset-tooltip" side="block-end">Save to local storage</sv-tooltip>
    </div>

    <div class="divider"></div>

    <div class="export-container" style="display: flex; flex-direction: column">
      <menu-component class="export-menu" match-trigger-width="true">
        <menu-trigger slot="trigger" trigger-label="Export">
          <div class="export-trigger-btn" slot="trigger-content">
            <span>Export</span>
            <svg class="export-trigger-btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
              <path
                d="M320-160q-17 0-28.5-11.5T280-200q0-17 11.5-28.5T320-240h320q17 0 28.5 11.5T680-200q0 17-11.5 28.5T640-160H320Zm160-160q-17 0-28.5-11.5T440-360v-287l-76 75q-11 11-27.5 11.5T308-572q-11-11-11-28t11-28l144-144q6-6 13-8.5t15-2.5q8 0 15 2.5t13 8.5l144 144q11 11 11.5 27.5T652-572q-11 11-28 11t-28-11l-76-75v287q0 17-11.5 28.5T480-320Z"
              />
            </svg>
          </div>
        </menu-trigger>

        <button class="export-menu-btn" data-dialog-open="export-css-keyframe-dialog">CSS Keyframe</button>
        <button class="export-menu-btn" data-dialog-open="export-css-linear-dialog">CSS Linear</button>
        <button class="export-menu-btn" data-dialog-open="export-svg-dialog">SVG Path</button>
        <button class="export-menu-btn" data-dialog-open="export-js-function-dialog">JS Function</button>
      </menu-component>
    </div>

    <div class="divider"></div>

    <p class="panel-title">Settings</p>

    <div class="checkbox-label-container" data-sv-tooltip="auto-hide-tooltip">
      <label for="auto-hide-toggle">Auto hide anchor points</label>
      <sv-toggle-checkbox id="auto-hide-toggle" aria-describedby="auto-hide-tooltip"></sv-toggle-checkbox>
    </div>
    <sv-tooltip id="auto-hide-tooltip" side="inline-end">Auto hide anchor points when the graph path is not focused</sv-tooltip>

    <div class="checkbox-label-container" data-sv-tooltip="snap-to-grid-tooltip">
      <label for="snap-to-grid-toggle">Enable snapping to grid</label>
      <sv-toggle-checkbox id="snap-to-grid-toggle" checked aria-describedby="snap-to-grid-tooltip"></sv-toggle-checkbox>
    </div>
    <sv-tooltip id="snap-to-grid-tooltip" side="inline-end">Enable snapping to the grid visible lines</sv-tooltip>

    <div class="checkbox-label-container" data-sv-tooltip="snap-to-points-tooltip">
      <label for="snap-to-points-toggle">Enable snapping to points</label>
      <sv-toggle-checkbox id="snap-to-points-toggle" checked aria-describedby="snap-to-points-tooltip"></sv-toggle-checkbox>
    </div>
    <sv-tooltip id="snap-to-points-tooltip" side="inline-end">
      Enable snapping to points and their horizontal/vertical guide lines
    </sv-tooltip>

    <div class="input-label-container">
      <label for="duration-input">Animation duration</label>
      <input type="number" name="duration" id="duration-input" value="2000" />
    </div>

    <div class="divider"></div>
    <p class="panel-title">SVG Path</p>
    <br />
    <sv-code-editor class="svg-path-code-editor" code-stylesheet=".svg-highlight" copy-button expand></sv-code-editor>
    <div class="divider"></div>
  </div>
</div>
