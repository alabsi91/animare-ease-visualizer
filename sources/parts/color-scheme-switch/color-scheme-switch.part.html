<button
  type="button"
  class="color-scheme-switch"
  aria-label="Switch to dark mode"
  aria-pressed="false"
  data-sv-tooltip="color-scheme-tooltip"
  aria-describedby="color-scheme-tooltip"
>
  <svg
    class="switch-icon switch-icon-sun"
    aria-hidden="true"
    focusable="false"

</button>

<insert selector="head">
  <script type="module">
    const STORAGE_KEY = "color-scheme";

    let currentScheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

    const stored = window.localStorage.getItem(STORAGE_KEY);
    if (stored === "dark" || stored === "light") {
      currentScheme = stored;
      document.documentElement.style.colorScheme = stored;
    }

    function labelButton(button, isDark) {
      button.setAttribute("aria-pressed", String(isDark));
      button.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
    }

    function applyScheme(scheme, buttons) {
      document.documentElement.style.colorScheme = scheme;
      window.localStorage.setItem(STORAGE_KEY, scheme);

      for (const button of buttons) {
        labelButton(button, scheme === "dark");
      }

      document.dispatchEvent(new CustomEvent("color-scheme-changed", { detail: scheme }));
    }

    async function revealFrom(update, x, y) {
      if (!document.startViewTransition || matchMedia("(prefers-reduced-motion: reduce)").matches) {
        update();
        return;
      }

      const transition = document.startViewTransition({ update, types: ["circular-reveal"] });
      await transition.ready;

      const xPercent = (x / window.innerWidth) * 100;
      const yPercent = (y / window.innerHeight) * 100;

      document.documentElement.animate(
        { clipPath: [`circle(0% at ${xPercent}% ${yPercent}%)`, `circle(150vmax at ${xPercent}% ${yPercent}%)`] },
        { duration: 400, easing: "cubic-bezier(0.64, 0, 0.78, 0)", pseudoElement: "::view-transition-new(root)" }
      );
    }

    function setupColorSchemeSwitches() {
      const buttons = document.querySelectorAll(".color-scheme-switch");

      for (const button of buttons) {
        labelButton(button, currentScheme === "dark");

        button.addEventListener("click", () => {
          const nextScheme = button.getAttribute("aria-pressed") === "true" ? "light" : "dark";
          const { left, top, width, height } = button.getBoundingClientRect();
          revealFrom(() => applyScheme(nextScheme, buttons), left + width / 2, top + height / 2);
        });
      }
    }

    document.addEventListener("DOMContentLoaded", setupColorSchemeSwitches, { once: true, passive: true });
  </script>
</insert>
